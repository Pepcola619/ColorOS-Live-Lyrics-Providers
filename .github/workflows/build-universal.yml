name: Build Universal Provider APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate persistent keystore if missing
        run: |
          if [ ! -f universal-provider/persistent-debug.jks ]; then
            keytool -genkey -v -keystore universal-provider/persistent-debug.jks \
              -storepass android123 -keypass android123 -alias mykey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ColorOSLyrics, OU=Dev, O=User, L=Moscow, S=Moscow, C=RU"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@://github.com"
            git add universal-provider/persistent-debug.jks
            git commit -m "Add persistent signing keystore"
            git push
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Universal Provider Debug APK
        run: ./gradlew :universal-provider:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-provider-debug
          path: universal-provider/build/outputs/apk/debug/*.apk
